name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Validate dataset and generated docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate data/servers.json
        run: npm run validate

      - name: Check that README.md and INDEX.md match the dataset
        run: node scripts/build.mjs --check
